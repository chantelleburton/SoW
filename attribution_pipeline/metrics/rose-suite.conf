[env]
# Overrides the repo checkout location used by task scripts.
ATTRIBUTION_PIPELINE_CODE_DIR=/data/users/bob.potts/StateOfFires_2025-26/code

[template variables]
ATTR_RUN_TYPE=['historicalExt', 'historicalNatExt']
COUNTRY=['Portugal','France','United_Kingdom','Spain']
# METRIC=['p95', '7x', 'cum']
ERA5_RUN_LABEL='Mean_RH_Mean_Wind'
HIST_MEMBER='1..15'
# COUNTRY=['Canada', 'Iberia', 'Chile', 'Korea', 'Scotland']
INDEX=['dsr']
# INDEX=['fwi', 'dsr']
METRIC=['7x']
N_PHYSICS=5
# HadGEM3-A Attribution ensemble geometry (105 runs x 5 physics = 525 members).
N_RUNS=105
RUN_ATTR_METRICS=false
# Which metric task families to run in this invocation. Defaults are false
# (opt-in) -- set the ones you want explicitly. RUN_ATTR_METRICS is
# diagnostic-only (see flow.cylc) and should normally stay false.
RUN_ERA5_METRICS=true
RUN_HISTIMPACTTB_METRICS=true
RUN_HISTXCLIM_METRICS=true
