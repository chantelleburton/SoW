[ns=metrics/dataset-toggles]
title=Dataset toggles
description=Select which metric task families run.

[ns=metrics/general]
title=General

[ns=metrics/era5]
title=ERA5

[ns=metrics/hg3-historical]
title=HadGEM3-A Historical

[ns=metrics/hg3-attribution]
title=HadGEM3-A Attribution

[template variables=RUN_ERA5_METRICS]
ns=metrics/dataset-toggles
type=boolean
title=Run ERA5 metrics
description=Whether to run the era5_metrics task family.

[template variables=RUN_HISTXCLIM_METRICS]
ns=metrics/dataset-toggles
type=boolean
title=Run HadGEM3-A Historical (xclim) metrics
description=Whether to run the histxclim_metrics task family.

[template variables=RUN_HISTIMPACTTB_METRICS]
ns=metrics/dataset-toggles
type=boolean
title=Run HadGEM3-A Historical (Impact Toolbox) metrics
description=Whether to run the histimpacttb_metrics task family.

[template variables=RUN_ATTR_METRICS]
ns=metrics/dataset-toggles
type=boolean
title=Run HadGEM3-A Attribution metrics (diagnostic)
description=Whether to run the attr_metrics task family. Diagnostic-only --
    normally left false.

[template variables=COUNTRY]
ns=metrics/general
title=Countries/regions
description=List of countries/regions to compute metrics for.
     Replace spaces in names with underscores
     (e.g. "United Kingdom" -> "United_Kingdom").
     -- This is due to cylc not accepting spaces in task names.

[template variables=INDEX]
ns=metrics/general
title=Index
description=fwi and/or dsr.

[template variables=METRIC]
ns=metrics/general
title=Metric
description=p95, 7x and/or cum.

[template variables=ERA5_RUN_LABEL]
ns=metrics/era5
title=Run label
description=Label of the ERA5 FWI-creation run to read metrics from.

[template variables=HIST_MEMBER]
ns=metrics/hg3-historical
title=Members
description=HadGEM3-A Historical ensemble member range.

[template variables=ATTR_RUN_TYPE]
ns=metrics/hg3-attribution
title=Run types
description=Attribution ensemble run types (historicalExt, historicalNatExt).

[template variables=N_RUNS]
ns=metrics/hg3-attribution
title=Number of runs
description=Number of HadGEM3-A Attribution ensemble runs.

[template variables=N_PHYSICS]
ns=metrics/hg3-attribution
title=Number of physics variants
description=Number of physics variants per attribution run.
