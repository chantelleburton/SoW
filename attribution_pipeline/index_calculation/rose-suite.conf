[env]
# Overrides the repo checkout location used by task scripts.
ATTRIBUTION_PIPELINE_CODE_DIR=/data/users/bob.potts/StateOfFires_2025-26/code

[template variables]
# ERA5 FWI-creation task parameters.
ERA5_START_YEAR=[1979, 1989, 1999, 2009, 2019]
ERA5_WIND_STAT=['mean']
# ERA5_WIND_STAT=['mean', 'max']
ERA5_RH_STAT=['mean']
# ERA5_RH_STAT=['mean', 'minimum']

# HadGEM3-A Attribution ensemble geometry (105 runs x 5 physics = 525 members).
N_RUNS=105
N_PHYSICS=5
ATTR_RUN_TYPE=['historicalExt', 'historicalNatExt']

# HadGEM3-A Historical FWI-creation task parameters.
HIST_MEMBER='1..15'
HIST_BLOCK_START_YEAR=[1970, 1980, 1990, 2000, 2010]
