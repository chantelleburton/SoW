[env]
# Overrides the repo checkout location used by task scripts.
ATTRIBUTION_PIPELINE_CODE_DIR=/data/users/bob.potts/StateOfFires_2025-26/code

[template variables]
# Which job families to run in this invocation. Defaults are false (opt-in).
# RUN_BIAS_CORRECTED gates the bias_correction task family (the actual
# bias-corrected output); RUN_UNCORRECTED_EXTRACTION gates the
# uncorrected_extraction task family (raw ensemble extraction, used only by
# supplement-figure panels).
RUN_BIAS_CORRECTED=false
RUN_UNCORRECTED_EXTRACTION=false

COUNTRY=['Iberia', 'Chile', 'Canada']
# COUNTRY=['Iberia', 'Chile', 'Canada', 'Korea', 'Scotland']
BASELINE_MEMBER='1..15'
RUNTYPE=['hist', 'histnat']
INDEX=['fwi']
# INDEX=['fwi', 'dsr']
METRIC=['p95']
# METRIC=['p95', '7x', 'cum']
HISTORICAL_SOURCE=['xclim', 'impacttb']
